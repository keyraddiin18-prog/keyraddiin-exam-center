<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Exam | KEYRADDIIN EXAM CENTER</title>

    <link
        rel="stylesheet"
        href="css/exam.css"
    >
</head>

<body>

    <!-- =========================================
         EXAM HEADER
    ========================================== -->

    <header class="exam-header">

        <div class="brand">

            <div class="brand-icon">
                🎓
            </div>

            <div>
                <h1>KEYRADDIIN</h1>
                <span>EXAM CENTER</span>
            </div>

        </div>


        <!-- Timer -->

        <div class="timer-box">

            <span class="timer-label">
                TIME LEFT
            </span>

            <strong id="timer">
                00:00
            </strong>

        </div>

    </header>


    <!-- =========================================
         MAIN EXAM AREA
    ========================================== -->

    <main class="exam-container">

        <!-- Exam Information -->

        <section class="exam-info-card">

            <div>

                <h2 id="examTitle">
                    Examination
                </h2>

                <p id="examDetails">
                    Loading exam...
                </p>

            </div>

            <div class="student-info">

                <span>Student</span>

                <strong id="studentName">
                    Student
                </strong>

            </div>

        </section>


        <!-- =====================================
             QUESTION NAVIGATION
        ====================================== -->

        <section class="question-navigation">

            <div class="navigation-header">

                <h3>
                    Questions
                </h3>

                <span id="questionProgress">
                    1 / 20
                </span>

            </div>


            <div
                id="questionNumbers"
                class="question-numbers"
            >
                <!-- Question numbers generated by JS -->

            </div>

        </section>


        <!-- =====================================
             QUESTION CARD
        ====================================== -->

        <section class="question-card">

            <div class="question-label">

                <span>
                    Question
                </span>

                <strong id="currentQuestionNumber">
                    1
                </strong>

            </div>


            <h2 id="questionText">
                Loading question...
            </h2>


            <!-- MCQ Options -->

            <div
                id="optionsContainer"
                class="options-container"
            >

                <!-- Options generated by JavaScript -->

            </div>

        </section>


        <!-- =====================================
             EXAM CONTROLS
        ====================================== -->

        <section class="exam-controls">

            <button
                type="button"
                id="previousButton"
                class="secondary-button"
            >
                ← Previous
            </button>


            <button
                type="button"
                id="nextButton"
                class="primary-button"
            >
                Next →
            </button>

        </section>


        <!-- =====================================
             SUBMIT AREA
        ====================================== -->

        <section class="submit-section">

            <p>
                Make sure you have answered all questions
                before submitting your examination.
            </p>

            <button
                type="button"
                id="submitButton"
                class="submit-button"
            >
                SUBMIT EXAM ✓
            </button>

        </section>

    </main>


    <!-- =========================================
         SUBMIT CONFIRMATION MODAL
    ========================================== -->

    <div
        id="submitModal"
        class="modal hidden"
    >

        <div class="modal-content">

            <div class="modal-icon">
                ⚠️
            </div>

            <h2>
                Submit Examination?
            </h2>

            <p id="submitMessage">
                Are you sure you want to submit your exam?
            </p>

            <div class="modal-buttons">

                <button
                    type="button"
                    id="cancelSubmit"
                    class="cancel-button"
                >
                    Cancel
                </button>

                <button
                    type="button"
                    id="confirmSubmit"
                    class="confirm-button"
                >
                    Yes, Submit
                </button>

            </div>

        </div>

    </div>


    <!-- =========================================
         EXAM ENGINE
    ========================================== -->

    <script
        src="js/exam-engine.js"
    ></script>

</body>
</html>
